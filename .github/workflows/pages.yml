name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter make-sfx-core build

      # The WAV files and sounds.json are committed; regenerating them must not
      # change anything, or the demo would serve sounds from an older engine.
      - name: Demo assets match the engine
        working-directory: examples/game-sfx-pack
        run: |
          pnpm generate > /dev/null
          if ! git diff --quiet -- public sounds.json; then
            git status --short -- public sounds.json
            echo "::error::examples/game-sfx-pack assets are stale; run pnpm generate there and commit the result"
            exit 1
          fi

      - name: Build game SFX pack demo
        working-directory: examples/game-sfx-pack
        env:
          VITE_BASE: /make-sfx/
        run: pnpm build

      # Serves dist/ under the Pages base path in Chrome: every procedural
      # button must render sound through the WASM engine, every WAV must load.
      - name: Smoke test in Chrome
        working-directory: examples/game-sfx-pack
        env:
          VITE_BASE: /make-sfx/
        run: pnpm smoke

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/game-sfx-pack/dist

      - id: deployment
        uses: actions/deploy-pages@v4